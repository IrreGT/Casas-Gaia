name: Monitor casas Gaia

on:
  schedule:
    - cron: "*/15 * * * *"     # de 15 em 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}        # botão "Run workflow" para testar à mão

permissions:
  contents: write              # para guardar o seen.json

concurrency:
  group: monitor-casas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # usa o Google Chrome que já vem no runner; só descarrega o Chromium se faltar
      - run: google-chrome --version || python -m playwright install --with-deps chromium

      - name: Procurar casas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py

      - name: Guardar anúncios já vistos
        run: |
          if ! git diff --quiet seen.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "seen: $(date -u +%F\ %H:%M)" -q
            git pull --rebase -q && git push -q
          fi
